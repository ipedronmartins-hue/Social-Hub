# Social Hub legacy TLS gateway
#
# Lumia 830 / Windows Phone 8.1 IE11 can negotiate TLS 1.2 with
# ECDHE-RSA-AES128-SHA256, but modern Vercel edge TLS may not.
#
# This gateway terminates legacy-compatible TLS and proxies upstream
# over modern HTTPS to the Vercel deployment.

events {}

http {
    upstream social_hub_upstream {
        server social-hub-three-sigma.vercel.app:443;
    }

    server {
        listen 443 ssl;
        server_name socialhub.example.com;

        ssl_certificate     /etc/letsencrypt/live/socialhub.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/socialhub.example.com/privkey.pem;

        # Compatibility target for IE11 on Windows Phone 8.1.
        # Do NOT enable TLS 1.0/1.1.
        ssl_protocols TLSv1.2;
        ssl_ciphers 'ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES128-SHA';
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve prime256v1;

        location / {
            proxy_pass https://social_hub_upstream;
            proxy_ssl_server_name on;
            proxy_ssl_name social-hub-three-sigma.vercel.app;
            proxy_set_header Host social-hub-three-sigma.vercel.app;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }
    }

    server {
        listen 80;
        server_name socialhub.example.com;
        return 301 https://$host$request_uri;
    }
}